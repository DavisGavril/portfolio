<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Davis Gavril | Anime Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
/* ===== GLOBAL ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Orbitron', sans-serif;}
body { background: #0b0003; color: #fff; overflow-x:hidden; }

/* NAV */
nav {
    position:fixed; top:0; width:100%; background: rgba(30,0,10,0.9);
    padding:15px 10%; display:flex; justify-content:space-between; z-index:1000;
    box-shadow:0 0 20px crimson;
}
nav a { margin-left:20px; cursor:pointer; transition:.3s; }
nav a:hover { color: crimson; }

/* SECTION */
section { min-height:100vh; padding:100px 10%; animation: fadeIn 0.8s ease; }
.hidden { display:none; }

@keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

/* HERO */
.hero h1 { font-size:3rem; color: crimson; text-shadow:0 0 15px crimson; }
.hero p { margin:20px 0; max-width:600px; }
.social i { font-size:1.6rem; margin-right:15px; transition:.3s; }
.social i:hover { color: crimson; transform:scale(1.2); }

/* PROJECTS */
.projects-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:20px; }
.card { background: rgba(40,0,10,0.8); padding:20px; border-radius:10px; box-shadow:0 0 15px darkred; transition:.3s; }
.card:hover { transform:translateY(-10px); box-shadow:0 0 25px crimson; }

/* CERTIFICATES */
.gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:15px; }
.gallery img { width:100%; border-radius:10px; cursor:pointer; border:2px solid crimson; transition:.3s; }
.gallery img:hover { transform:scale(1.05); box-shadow:0 0 20px crimson; }

/* POPUP */
.popup { position:fixed; inset:0; background: rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:2000; }
.popup img { max-width:90%; max-height:90%; border-radius:10px; border:2px solid crimson; }
.popup span { position:absolute; top:20px; right:30px; font-size:40px; cursor:pointer; color:white; }

/* PARTICLES */
canvas { position:fixed; top:0; left:0; z-index:-1; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<nav>
    <strong>DAVIS</strong>
    <div>
        <a onclick="show('home')">Home</a>
        <a onclick="show('projects')">Projects</a>
        <a onclick="show('certificates')">Certificates</a>
    </div>
</nav>

<!-- HOME -->
<section id="home" class="hero">
    <h1>Davis Gavril</h1>
    <p>Anime-inspired developer portfolio with dark red theme, background particles, and motion effects.</p>
    <div class="social">
        <a href="https://github.com/DavisGavril" target="_blank"><i class="fab fa-github"></i></a>
        <a href="mailto:yourmail@gmail.com"><i class="fas fa-envelope"></i></a>
        <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
    </div>
</section>

<!-- PROJECTS -->
<section id="projects" class="hidden">
    <h1 style="color:crimson;">Projects</h1><br>
    <div class="projects-grid">
        <div class="card">Portfolio Website</div>
        <div class="card">Weather App (API)</div>
        <div class="card">Flutter To-Do App</div>
        <div class="card">Event Management Website</div>
    </div>
</section>

<!-- CERTIFICATES -->
<section id="certificates" class="hidden">
    <h1 style="color:crimson;">Certificates</h1><br>
    <div class="gallery" id="gallery"></div>
</section>

<!-- POPUP -->
<div class="popup" id="popup">
    <span onclick="closePopup()">×</span>
    <img id="popupImg">
</div>

<script>
/* ===== PAGE SWITCH ===== */
function show(id){
    document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
}

/* ===== CERTIFICATE GALLERY ===== */
const gallery = document.getElementById("gallery");
const TOTAL_CERTS = 30; // Change this to number of images you have

for(let i=1;i<=TOTAL_CERTS;i++){
    const img=document.createElement("img");
    img.src=certificates/cert${i}.jpg;
    img.alt=Certificate ${i};
    img.onerror=()=>img.remove(); // remove missing images
    img.onclick=()=>{ 
        document.getElementById("popupImg").src=img.src;
        document.getElementById("popup").style.display="flex";
    };
    gallery.appendChild(img);
}

/* POPUP CLOSE */
function closePopup(){ document.getElementById("popup").style.display="none"; }

/* ===== PARTICLES ===== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth; canvas.height=innerHeight;
let particles=[];
for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2,
        dx:(Math.random()-0.5),
        dy:(Math.random()-0.5)
    });
}
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="crimson";
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        p.x+=p.dx; p.y+=p.dy;
        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
