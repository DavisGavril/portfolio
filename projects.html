    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<body>

    <nav class="navbar">
        <div class="logo">Davis<span>Gavril</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html" class="active">Projects</a></li>
            <li><a href="certificates.html">Certificates</a></li>
            <li><a href="#" id="contact-btn">Contact</a></li>
            <li><button class="theme-toggle" id="theme-toggle"><i class="fas fa-moon"></i></button></li>
        </ul>
        <div class="hamburger"><i class="fas fa-bars"></i></div>
    </nav>

    <section class="container">
        <h2 class="section-title">Academic Projects</h2>
        <div class="projects-grid">
            
            <div class="card project-card">
                <img src="dr-venom.jpg" alt="Dr Venom">
                <div class="card-content">
                    <h3>Dr. Venom (SOS)</h3>
                    <span class="date-badge">Apr 2025</span>
                    <p style="margin: 10px 0;">Web app for venomous bite assistance with real-time SOS.</p>
                    <button class="btn primary view-project" 
                        data-title="Dr. Venom" 
                        data-tech="AngularJS, MySQL, Google Maps API" 
                        data-desc="Developed a responsive web application to provide rapid emergency assistance and guidance for venomous animal bites and stings. Implemented real-time SOS sending with geolocation and emergency contact notifications.">
                        View Details
                    </button>
                </div>
            </div>

            <div class="card project-card">
                 <img src="todo-app.jpg" alt="To Do App">
                <div class="card-content">
                    <h3>To-Do App</h3>
                    <span class="date-badge">Jan 2025</span>
                    <p style="margin: 10px 0;">Flutter mobile app for managing daily tasks.</p>
                    <button class="btn primary view-project" 
                        data-title="To-Do App" 
                        data-tech="Flutter, Firebase, SQLite" 
                        data-desc="Developed a mobile application for managing daily tasks, projects, and time entries. Designed an intuitive UI using Flutter's Material Design components. Features include task grouping and swipe-to-delete actions.">
                        View Details
                    </button>
                </div>
            </div>

        </div>
    </section>
