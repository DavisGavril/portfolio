<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Davis Gavril T</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Davis<span>Gavril</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="certificates.html">Certificates</a></li>
            <li><a href="contact.html" class="active">Contact</a></li> <li><button class="theme-toggle" id="theme-toggle"><i class="fas fa-moon"></i></button></li>
        </ul>
        <div class="hamburger"><i class="fas fa-bars"></i></div>
    </nav>

    <section class="container">
        <h2 class="section-title">Get In Touch</h2>
        
        <div class="projects-grid" style="align-items: flex-start;">
            
            <div class="card" style="text-align: left; max-width: 400px; width: 100%;">
                <h3 style="margin-bottom: 20px; color: var(--primary-color);">Contact Information</h3>
                
                <div style="margin-bottom: 15px;">
                    <i class="fas fa-envelope" style="color: var(--primary-color); width: 25px;"></i>
                    <a href="mailto:davisgavril292006@gmail.com" style="text-decoration: none; color: var(--text-color);">
                        davisgavril292006@gmail.com
                    </a>
                </div>

                <div style="margin-bottom: 15px;">
                    <i class="fas fa-phone" style="color: var(--primary-color); width: 25px;"></i>
                    <span>+91 9363015224</span>
                </div>

                <div style="margin-bottom: 15px;">
                    <i class="fas fa-map-marker-alt" style="color: var(--primary-color); width: 25px;"></i>
                    <span>Erode, Tamil Nadu, India</span>
                </div>

                <div style="margin-top: 30px;">
                    <h4 style="margin-bottom: 10px;">Connect on Socials</h4>
                    <div class="social-icons" style="text-align: left;">
                        <a href="https://github.com/DavisGavril" target="_blank" style="margin-right: 15px;"><i class="fab fa-github"></i></a>
                        <a href="https://www.linkedin.com/in/davis-gavril-t-7a6949290" target="_blank"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>

            <div class="card" style="flex-grow: 1; max-width: 600px; text-align: left;">
                <h3 style="margin-bottom: 20px;">Send a Message</h3>
                <form id="contact-form">
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Name</label>
                        <input type="text" placeholder="Your Name" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-color); color: var(--text-color);">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email</label>
                        <input type="email" placeholder="Your Email" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-color); color: var(--text-color);">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Message</label>
                        <textarea rows="5" placeholder="Your Message" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-color); color: var(--text-color);"></textarea>
                    </div>
                    <button type="submit" class="btn primary">Send Message <i class="fas fa-paper-plane"></i></button>
                </form>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2025 Davis Gavril T.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
    
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Message Sent!',
                text: 'Thank you for reaching out. I will get back to you soon.',
                icon: 'success',
                confirmButtonColor: '#d60000'
            });
            this.reset();
        });
    </script>
</body>
</html>
